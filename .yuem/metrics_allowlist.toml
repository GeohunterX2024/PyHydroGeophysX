# Files whose hits a ratchet metric does not count (docs/yuem/adr/0003, plan M2.3).
#
# Only boundary code belongs here: command-line front ends whose job is to
# print, and the outermost handlers whose job is to catch everything and report
# it (module loader, worker top level, diagnostics). Every entry states why.
# tools/yuem/metrics.py reports the allowlisted hits separately, so they stay
# visible; adding an entry is reviewed like a baseline change.

[print_calls]
"PyHydroGeophysX/workflows/cli.py" = "command-line front end: stdout and stderr are its output"
"PyHydroGeophysX/doctor.py" = "command-line front end: prints the self-check report"
"PyHydroGeophysX/qt_apps/em_probe.py" = "probe subprocess: its one JSON line on stdout is the answer the Studio reads"
"PyHydroGeophysX/qt_apps/adtlert_probe.py" = "probe subprocess: its one JSON line on stdout is the answer the Studio reads"
"PyHydroGeophysX/qt_apps/agent/one_click_runner.py" = "runner subprocess: JSON-lines events on stdout are its protocol with the Studio"
"PyHydroGeophysX/qt_apps/agent/selftest.py" = "command-line front end: prints the PASS/FAIL report"
"PyHydroGeophysX/workflows/codegen.py" = "the print is in the template of the generated script, a command-line front end"

[broad_except]
"PyHydroGeophysX/doctor.py" = "diagnostic boundary: a failing check is the finding and is reported, never raised"
"PyHydroGeophysX/_internal/simpeg_compat.py" = "SimPEG < 0.25 raises a bare Exception for an unknown keyword; anything else is re-raised"
"PyHydroGeophysX/_internal/plugin_loader.py" = "plugin-loading boundary: a broken plugin is recorded and logged, never allowed to stop the others or the Studio"

[suppressions]
"PyHydroGeophysX/doctor.py" = "its noqa: BLE001 markers document the diagnostic boundary above"
"PyHydroGeophysX/_internal/plugin_loader.py" = "its noqa: BLE001 marker documents the plugin-loading boundary above"

[global_np_random]
"PyHydroGeophysX/inversion/joint_gravity_magnetics.py" = "seeds SimPEG < 0.23 directives that draw from the legacy global RNG; the state is saved before and restored after (newer SimPEG gets the seed on the directive itself)"

